name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          v="${{ steps.release.outputs.new_release_version }}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.new_release_published == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.new_release_published == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.release.outputs.new_release_published == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/chof64/opencode-proxy:${{ steps.tags.outputs.full }}
            ghcr.io/chof64/opencode-proxy:${{ steps.tags.outputs.minor }}
            ghcr.io/chof64/opencode-proxy:latest
            ghcr.io/chof64/opencode-proxy:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
